# Codon — example user configuration
#
# Copy this file to ~/.config/codon/codon.toml (or its platform
# equivalent under XDG_CONFIG_HOME) and edit. Codon merges your file
# on top of its embedded defaults, so anything you omit keeps the
# default behaviour. Live-reload is on — saves take effect without a
# restart.
#
# Three top-level sections:
#
#   [settings.*]   — Zed-equivalent settings (theme, fonts, editor,
#                    terminal, language overrides). Mirrors Zed's
#                    SettingsContent struct shape; see
#                    crates/codon-config/README.md for the full
#                    mapping rules.
#
#   [keymap]       — keymap-wide settings (currently just the chord
#                    prefix used by the embedded defaults).
#
#   [bindings.*]   — codon keybindings, grouped by context. Three
#                    pane-scoped sub-tables (editor / terminal /
#                    file_manager) plus a global one. Each has
#                    optional `normal` and `insert` mode sub-tables.
#
# Action names use Zed's namespaced format
# (`codon_session::SessionNew`, `workspace::ActivatePaneLeft`, …).
# Press `prefix F1` from inside codon (default: `cmd-k F1`) to see
# every active binding.

# ═══ Settings ════════════════════════════════════════════════════════
[settings]
# Editor font (passed through to Zed; any installed family works).
buffer_font_family = "JetBrainsMono Nerd Font"
buffer_font_size = 14
ui_font_size = 14

# UI scaling — leave at 1.0 unless you have a HiDPI quirk.
ui_font_features = { calt = false }

[settings.theme]
mode = "system"
light = "One Light"
dark = "One Dark"

[settings.editor]
# Most popular editor settings have a single key under [settings].
# Group them under [settings.editor] only when Zed's struct does too.
# Run codon and inspect codon.toml after migration to see your tree.

[settings.terminal]
# default_command = ["/opt/homebrew/bin/fish"]

# Per-language overrides use [settings.languages.<name>]; quote the
# name when it contains symbols (TOML rule, e.g. "c++").
[settings.languages.rust]
formatter = "language_server"
format_on_save = "on"

# [settings.languages."c++"]
# formatter = { external = { command = "clang-format" } }

# ═══ Keymap — chord prefix ══════════════════════════════════════════
# Codon's embedded defaults wire ~40 tmux-style chords under a single
# prefix: window/session lifecycle, splits, panes-from-panels, agent
# verbs, jumps, palette, cheatsheet. The prefix below is substituted
# into every chord whose keystroke starts with the literal token
# `prefix` (in defaults *and* in your own bindings below). Default is
# `cmd-k`; set to `ctrl-x` / `ctrl-b` / `ctrl-a` etc. to match a tmux
# config.
#
# Single-keystroke chord only (e.g. "ctrl-x", "cmd-k"); empty string
# falls back to the default. Reloads atomically on save.
[keymap]
# prefix = "ctrl-x"

# ═══ Which-key chord HUD ════════════════════════════════════════════
# Codon's chord HUD is a Helix-style overlay rendered across the full
# width of the active pane. It appears after a short hold on the chord
# prefix and shows the bindings reachable from the current state. The
# rendering, settings, and auto-flip rule are owned by the
# `codon-which-key` crate (vendored Zed's `which_key` is not wired into
# codon's init path).
[which_key]
# Master switch. Set to false to suppress the HUD entirely without
# touching delay_ms (the chord still fires immediately).
# enabled = true
#
# Hold duration before the HUD shows up, in milliseconds. Lower values
# surface bindings faster; higher values keep fast typists' screens clean.
# delay_ms = 250
#
# Minimum width per column when laying out the HUD's rows. Codon divides
# the active pane's width by this value (floor) to pick a column count;
# wider panes get more columns, narrow panes collapse to one column.
# min_column_width = 240
#
# Fraction of the active pane's height above which the HUD flips from
# the bottom edge to the top edge. Use a smaller value (e.g. 0.3) to
# flip more aggressively in short panes; closer to 0.9 to keep the
# bottom anchor in most cases. Clamped to [0.1, 0.9] on load.
# flip_threshold = 0.5

# ═══ Window chrome ═══════════════════════════════════════════════════
# Codon-only knobs that don't map to Zed settings; read at startup and
# applied to the title-bar renderer.
[window]
# Stop mouse-dragging the titlebar from moving the window. Useful when
# the traffic-light buttons are hidden and you only want keyboard-driven
# placement via codon-session bindings — accidental drags become no-ops.
# disable_drag = true
#
# Stop double-click on the titlebar from maximizing/zooming. Pair with
# `disable_drag` for a fully inert titlebar strip.
# disable_double_click_zoom = true

# ═══ Keybindings — global ════════════════════════════════════════════
[bindings.global]
# Pane focus (vim/helix muscle memory). ctrl-{h,j,k,l} collide with
# terminal control codes (BS / LF / kill-line / clear) so the prefix
# arrow chords below are the universal alternative that works from
# every pane kind, terminals included.
"ctrl-h" = "workspace::ActivatePaneLeft"
"ctrl-j" = "workspace::ActivatePaneDown"
"ctrl-k" = "workspace::ActivatePaneUp"
"ctrl-l" = "workspace::ActivatePaneRight"

# Pane focus (prefix + arrow) — terminal-safe alternative.
"prefix left"  = "workspace::ActivatePaneLeft"
"prefix down"  = "workspace::ActivatePaneDown"
"prefix up"    = "workspace::ActivatePaneUp"
"prefix right" = "workspace::ActivatePaneRight"

# Pane move — swap with neighbour
"ctrl-shift-h" = "workspace::SwapPaneLeft"
"ctrl-shift-j" = "workspace::SwapPaneDown"
"ctrl-shift-k" = "workspace::SwapPaneUp"
"ctrl-shift-l" = "workspace::SwapPaneRight"

# Pane move (prefix + shift-arrow) — terminal-safe alternative.
"prefix shift-left"  = "workspace::SwapPaneLeft"
"prefix shift-down"  = "workspace::SwapPaneDown"
"prefix shift-up"    = "workspace::SwapPaneUp"
"prefix shift-right" = "workspace::SwapPaneRight"

# Pane resize (held under prefix to avoid clashing with move). The
# codon_session wrappers nudge the pane and arm a 1.5s sticky window:
# during it, bare h/j/k/l keep resizing without the prefix; esc / any
# other key / timeout exits.
"prefix shift-h" = "codon_session::ResizePaneLeft"
"prefix shift-j" = "codon_session::ResizePaneDown"
"prefix shift-k" = "codon_session::ResizePaneUp"
"prefix shift-l" = "codon_session::ResizePaneRight"

# Pane splitting (tmux-flavoured)
# Contextual split — `\` / `-` open whatever kind the active pane is
# (terminal-focused → terminal, fm-focused → fm, editor-focused →
# editor); `|` / `_` flip the terminal ↔ file-manager pair. See
# REQ:codon/keymap-vocabulary#c-verb-collapse-split.
"prefix \\" = "codon_session::SplitRight"
"prefix |"  = "codon_session::SplitRightOther"
"prefix -"  = "codon_session::SplitDown"
"prefix _"  = "codon_session::SplitDownOther"

# Pane lifecycle. `cmd-w` is the single user-facing close verb,
# falling through codon's safe close cascade (close item → close pane
# → close session window → empty pane reset). The OS window is only
# ever closed via `cmd-shift-w` or `cmd-shift-q`. `prefix t / e` mirror
# `cmd-t / cmd-e` (goto-or-open); `prefix shift-t / shift-e` are the
# always-new variants.
"prefix t"       = "codon_session::GotoOrOpenTerminal"
"prefix e"       = "codon_session::GotoOrOpenFileManager"
"prefix shift-t" = "workspace::NewTerminal"
"prefix shift-e" = "file_manager::OpenNew"
"cmd-w"          = "codon_session::Close"

# Goto-or-open: single chord lands on the most-recently-active pane of
# the requested kind, or opens one in the active pane if none exists.
"cmd-t"       = "codon_session::GotoOrOpenTerminal"
"cmd-e"       = "codon_session::GotoOrOpenFileManager"
"cmd-shift-e" = "codon_session::GotoOrOpenEditor"

# Quit. cmd-q must be *held* for ~1.5 seconds to actually quit (Chrome
# style) — a single tap shows a toast and otherwise does nothing.
# cmd-shift-q is the immediate-quit escape hatch. Both are filtered out
# of the command palette so `:q<Enter>` can't accidentally exit the app.
"cmd-q"       = "codon_session::HoldQuit"
"cmd-shift-q" = "zed::Quit"

# Sessions (`prefix s …` family)
"prefix s n" = "codon_session::SessionNew"
"prefix s s" = "codon_session::SessionSwitch"
"prefix s c" = "codon_session::SessionClose"

# Windows within a session — `prefix w …` is the discoverable menu;
# `prefix shift-w` opens the window overview as a single chord.
# `ctrl-w` is intentionally left unbound — reserved for delete-word in
# insert mode.
"prefix shift-w"     = "codon_session::WindowOverview"
"prefix w n"         = "codon_session::WindowNew"
"prefix w l"         = "codon_session::WindowNext"
"prefix w h"         = "codon_session::WindowPrev"
"prefix w shift-l"   = "codon_session::WindowLast"
"prefix w c"         = "codon_session::WindowClose"
"prefix w w"         = "codon_session::WindowSwitch"
"prefix w r"         = "codon_session::WindowRename"
"prefix w !"         = "codon_session::BreakPaneToWindow"

# 2-key window motion — muscle-memory path that mirrors tmux's
# `prefix n` / `prefix p`. (`prefix l` was dropped in phase 20 — use
# `prefix w shift-l` for WindowLast.)
"prefix n" = "codon_session::WindowNext"
"prefix p" = "codon_session::WindowPrev"
"prefix r" = "codon_session::WindowRename"
"prefix !" = "codon_session::BreakPaneToWindow"

# Direct index goto — tmux's `prefix 0-9`. 1-based here to match
# tmux; the action stores 0-based internally. Out-of-range indices
# are silent no-ops.
"prefix 1" = "codon_session::WindowGoto(0)"
"prefix 2" = "codon_session::WindowGoto(1)"
"prefix 3" = "codon_session::WindowGoto(2)"
"prefix 4" = "codon_session::WindowGoto(3)"
"prefix 5" = "codon_session::WindowGoto(4)"
"prefix 6" = "codon_session::WindowGoto(5)"
"prefix 7" = "codon_session::WindowGoto(6)"
"prefix 8" = "codon_session::WindowGoto(7)"
"prefix 9" = "codon_session::WindowGoto(8)"

# Agent (`prefix a …` family). Explain / Summarize / Refactor capture the
# active selection (text from focused editor or terminal), open the
# agent panel, and seed the message editor with a prompt prefix.
"prefix a a" = "assistant::FocusAgent"
"prefix a e" = "codon_agent::AgentExplain"
"prefix a s" = "codon_agent::AgentSummarize"
"prefix a r" = "codon_agent::AgentRefactor"

# Git (`prefix g …` family)
"prefix g m" = "git::GenerateCommitMessage"
# `prefix g s` is rebound by Phase 12 to the codon-panes "open as pane"
# action. The legacy `git_panel::ToggleFocus` still exists if you prefer
# the dock toggle — uncomment to restore it.
"prefix g s" = "codon_panes::OpenGit"
# "prefix g s" = "git_panel::ToggleFocus"

# Panes-from-panels (Phase 12). `prefix <chord>` opens the panel as a
# regular workspace pane; `prefix shift-<chord>` opens it as a transient
# peek (auto-toggles on re-invocation, no persistence). See
# `.specs/codon/panes-from-panels.spec.md` for the contract.
# "prefix a"       = "codon_panes::OpenAgent"     # agent panel as pane
# "prefix shift-a" = "codon_panes::PeekAgent"     # agent panel right peek
# "prefix g"       = "codon_panes::OpenGit"       # git panel as pane
# "prefix shift-g" = "codon_panes::PeekGit"       # git panel left peek
# "prefix o"       = "codon_panes::OpenOutline"   # outline panel as pane
# "prefix shift-o" = "codon_panes::PeekOutline"   # outline panel left peek
# "prefix d"       = "codon_panes::OpenDebug"     # debug panel as pane
# "prefix shift-d" = "codon_panes::PeekDebug"     # debug panel bottom peek

# Help / cheatsheet — full-screen list of every active binding.
"prefix f1" = "codon_keymap::ShowKeymap"

# Welcome page
"prefix f2" = "zed::ShowWelcome"

# Command palette (Helix-style `:` plus the platform-native chord)
"cmd-shift-p" = "codon_command_palette::Toggle"

# ═══ Pane-scoped overrides ═══════════════════════════════════════════
# These only fire when the named pane is focused and in the given
# mode. Use them to specialise behaviour for the file manager,
# terminal, or editor without changing the global map.

[bindings.file_manager.normal]
# `:` opens the command palette (Helix-style); already in defaults.
# "j" = "file_manager::NavigateDown"
# "k" = "file_manager::NavigateUp"
# "h" = "file_manager::ParentDirectory"
# "l" = "file_manager::EnterDirectory"

[bindings.terminal.normal]
# `:` opens the command palette (Helix-style); already in defaults.
# Vim-style scrollback nav is the default; override if you prefer
# different keys.
# "j" = "terminal::ScrollLineDown"
# "k" = "terminal::ScrollLineUp"
# "ctrl-d" = "terminal::ScrollHalfPageDown"
# "ctrl-u" = "terminal::ScrollHalfPageUp"

[bindings.editor.normal]
# `:` opens the command palette (Helix-style); already in defaults.
# Helix mode is force-enabled on editors; defaults match upstream
# Helix. Override here for personal muscle memory.

[bindings.editor.insert]
# Most users leave this empty so the editor behaves like a plain
# text editor when typing.

[bindings.git_panel.normal]
# Helix-style verbs on the git dock when the changes list is focused.
# Already in defaults — listed here for reference / override:
# "j" = "git_panel::NextEntry"
# "k" = "git_panel::PreviousEntry"
# "g g" = "git_panel::FirstEntry"
# "shift-g" = "git_panel::LastEntry"
# "enter" = "menu::Confirm"          # open diff for selected entry
# "s" = "git::StageFile"
# "u" = "git::UnstageFile"
# "space" = "git::ToggleStaged"
# "i" = "git_panel::FocusEditor"     # enter Insert (commit message)

[bindings.git_panel.insert]
# Active while the commit-message editor is focused. Esc returns to
# the changes list (modulo vim's own Esc handling at the editor
# level — if that wins, rebind below to a chord like `prefix q`).
# "escape" = "git_panel::FocusChanges"
