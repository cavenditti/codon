[workspace]
resolver = "2"
members = [
    # The binary
    "apps/codon",

    # GPUI core (from Zed)
    "vendor/zed/crates/gpui",
    "vendor/zed/crates/gpui_macros",
    "vendor/zed/crates/gpui_macos",
    "vendor/zed/crates/gpui_platform",
    "vendor/zed/crates/gpui_shared_string",
    "vendor/zed/crates/gpui_util",
    "vendor/zed/crates/collections",
    "vendor/zed/crates/refineable",
    "vendor/zed/crates/refineable/derive_refineable",
    "vendor/zed/crates/scheduler",
    "vendor/zed/crates/sum_tree",
    "vendor/zed/crates/util",
    "vendor/zed/crates/util_macros",
    "vendor/zed/crates/http_client",
    "vendor/zed/crates/media",
    "vendor/zed/crates/ztracing",
    "vendor/zed/crates/ztracing_macro",
    "vendor/zed/crates/zlog",
    "vendor/zed/crates/gpui_linux",
    "vendor/zed/crates/gpui_wgpu",
    "vendor/zed/tooling/perf",


    # Helix (minimum for Document + Rope)
    "vendor/helix/helix-core",
    "vendor/helix/helix-view",
    "vendor/helix/helix-loader",
    "vendor/helix/helix-stdx",
    "vendor/helix/helix-event",
    "vendor/helix/helix-lsp",
    "vendor/helix/helix-lsp-types",
    "vendor/helix/helix-parsec",
    "vendor/helix/helix-vcs",
    "vendor/helix/helix-dap",
    "vendor/helix/helix-dap-types",
]

[workspace.package]
edition = "2024"
publish = false
# Helix workspace.package fields (inherited by Helix crates)
version = "25.7.1"
authors = ["Blaž Hrastnik <blaz@mxxn.io>"]
categories = ["editor"]
repository = "https://github.com/helix-editor/helix"
homepage = "https://helix-editor.com"
license = "MPL-2.0"
rust-version = "1.90"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
style = { level = "allow", priority = -1 }
type_complexity = "allow"

[workspace.dependencies]
#
# Zed internal path crates
#
collections = { path = "vendor/zed/crates/collections" }
derive_refineable = { path = "vendor/zed/crates/refineable/derive_refineable" }
gpui = { path = "vendor/zed/crates/gpui", default-features = false, features = ["font-kit"] }
gpui_macros = { path = "vendor/zed/crates/gpui_macros" }
gpui_macos = { path = "vendor/zed/crates/gpui_macos", default-features = false, features = ["font-kit"] }
gpui_platform = { path = "vendor/zed/crates/gpui_platform", default-features = false }
gpui_shared_string = { path = "vendor/zed/crates/gpui_shared_string" }
gpui_linux = { path = "vendor/zed/crates/gpui_linux", default-features = false }
gpui_util = { path = "vendor/zed/crates/gpui_util" }
gpui_wgpu = { path = "vendor/zed/crates/gpui_wgpu" }
http_client = { path = "vendor/zed/crates/http_client" }
media = { path = "vendor/zed/crates/media" }
perf = { path = "vendor/zed/tooling/perf" }
refineable = { path = "vendor/zed/crates/refineable" }
scheduler = { path = "vendor/zed/crates/scheduler" }
sum_tree = { path = "vendor/zed/crates/sum_tree" }
util = { path = "vendor/zed/crates/util" }
util_macros = { path = "vendor/zed/crates/util_macros" }
zlog = { path = "vendor/zed/crates/zlog" }
ztracing = { path = "vendor/zed/crates/ztracing" }
ztracing_macro = { path = "vendor/zed/crates/ztracing_macro" }


#
# Helix internal path crates
#
helix-core = { path = "vendor/helix/helix-core" }
helix-view = { path = "vendor/helix/helix-view" }
helix-loader = { path = "vendor/helix/helix-loader" }
helix-stdx = { path = "vendor/helix/helix-stdx" }
helix-event = { path = "vendor/helix/helix-event" }
helix-lsp = { path = "vendor/helix/helix-lsp" }
helix-lsp-types = { path = "vendor/helix/helix-lsp-types" }
helix-parsec = { path = "vendor/helix/helix-parsec" }
helix-vcs = { path = "vendor/helix/helix-vcs" }
helix-dap = { path = "vendor/helix/helix-dap" }
helix-dap-types = { path = "vendor/helix/helix-dap-types" }

#
# Terminal
#
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "9d9640d4" }

#
# External crates (from Zed's workspace)
#
anyhow = "1.0.86"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "notification", "open_uri", "file_chooser", "settings", "trash"] }
async-channel = "2.5.0"
async-compression = { version = "0.4", features = ["bzip2", "gzip", "futures-io"] }
async-fs = "2.1"
async-tar = "0.5.1"
async-task = "4.7"
async_zip = { version = "0.0.18", features = ["deflate", "deflate64"] }
backtrace = "0.3"
base64 = "0.22"
bitflags = "2.11"
bytes = "1.0"
chrono = { version = "0.4", features = ["serde"] }
cocoa = "=0.26.0"
cocoa-foundation = "=0.2.0"
core-foundation = "=0.10.0"
core-foundation-sys = "0.8.6"
core-video = { version = "0.5.2", features = ["metal"] }
ctor = "0.4.0"
derive_more = { version = "2.1.1", features = ["add", "add_assign", "deref", "deref_mut", "display", "from_str", "mul", "mul_assign", "not"] }
dirs = "6.0"
dunce = "1.0"
env_logger = "0.11"
futures = "0.3.32"
futures-concurrency = "7.7.1"
futures-lite = "1.13"
git2 = { version = "0.20.1", default-features = false, features = ["vendored-libgit2"] }
globset = "0.4"
hdrhistogram = "7"
heapless = "0.9.2"
heck = "0.5"
http = "1.1"
http-body = "1.0"
image = "0.25.1"
indexmap = { version = "2.7.0", features = ["serde"] }
inventory = "0.3.19"
itertools = "0.14.0"
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
mach2 = "0.5"
metal = "0.33"
nix = "0.29"
objc = "0.2"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSGraphics"] }
parking_lot = "0.12.1"
percent-encoding = "2.3.2"
pollster = "0.4.0"
portable-pty = "0.9.0"
postage = { version = "0.5", features = ["futures-traits"] }
pretty_assertions = { version = "1.3.0", features = ["unstable"] }
proc-macro2 = "1.0.93"
profiling = "1"
proptest = { git = "https://github.com/proptest-rs/proptest", rev = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b", features = ["attr-macro"] }
quote = "1.0.9"
rand = "0.9"
rayon = "1.8"
regex = "1.5"
rust-embed = { version = "8.11", features = ["include-exclude"] }
rustc-hash = "2.1.0"
schemars = { version = "1.0", features = ["indexmap2"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
serde_json_lenient = { version = "0.2", features = ["preserve_order", "raw_value"] }
serde_urlencoded = "0.7"
sha2 = "0.10"
shlex = "1.3.0"
slotmap = "1.1.1"
smallvec = { version = "1.6", features = ["union", "const_new"] }
smol = "2.0"
stacksafe = "0.1"
strum = { version = "0.27.2", features = ["derive"] }
syn = { version = "2.0.101", features = ["full", "extra-traits", "visit-mut"] }
take-until = "0.2.0"
tempfile = "3.20.0"
thiserror = "2.0.12"
tracing = "0.1.40"
unicase = "2.6"
unicode-segmentation = "1.13"
url = "2.2"
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
walkdir = "2.5"
wasm-bindgen = "0.2.113"
web-time = "1.1.0"
wgpu = { git = "https://github.com/zed-industries/wgpu.git", branch = "v29" }
which = "6.0.0"

#
# Helix-specific external crates
#
arc-swap = "1.9"
etcetera = "0.11"
foldhash = "0.2"
futures-executor = "0.3"
futures-util = { version = "0.3", features = ["std", "async-await"], default-features = false }
nucleo = "0.5.0"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
sonic-rs = "0.5"
termina = "0.3"
tokio-stream = "0.1.18"
toml = "1.1"
tree-house = { version = "0.3.0", default-features = false }

# Optional/platform deps referenced by Zed crates (must exist even if not compiled)
scap = { git = "https://github.com/zed-industries/scap", rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac", default-features = false, package = "zed-scap" }

[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

