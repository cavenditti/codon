[package]
name = "codon-jump"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/codon_jump.rs"

[dependencies]
anyhow.workspace = true
codon-config.workspace = true
# Depends on the bridge-trait sub-crate, not on `codon-mode`
# itself: `codon-mode` pulls in `vim` for its mode-indicator, and
# `vim` transitively depends on `editor` which depends on
# `codon-jump`. The bridge trait lives in its own crate to keep
# this edge cycle-free.
codon-pane-bridge.workspace = true
fs.workspace = true
futures.workspace = true
gpui.workspace = true
log.workspace = true
serde.workspace = true
settings.workspace = true
theme.workspace = true
toml.workspace = true
ui.workspace = true
workspace.workspace = true
